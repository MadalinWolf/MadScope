# Release: builds genuine MadScope desktop installers on GitHub-hosted runners
# and publishes them to a GitHub Release. Triggered by pushing a version tag:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Artifacts are renamed to canonical names (see RELEASE_NOTES.md) and the
# release body comes from RELEASE_NOTES.md with CHECKSUMS.txt attached.
# No secrets are required: macOS builds are unsigned (documented).
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            target: x86_64-pc-windows-msvc
          - os: macos-14
            platform: mac-arm64
            target: aarch64-apple-darwin
          - os: macos-14
            platform: mac-x64
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install workspace dependencies
        run: npm ci

      - name: Build packages, CLI and desktop UI
        run: npm run build

      - name: Build desktop engine bundle (Node + server + Chromium)
        working-directory: apps/desktop
        run: node scripts/build-sidecar.mjs --platform=${{ matrix.platform }}

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}

      - name: Validate Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem apps/desktop/src-tauri/target/*/release/bundle/msi/*.msi
          $exe = Get-ChildItem apps/desktop/src-tauri/target/*/release/bundle/nsis/*-setup.exe
          foreach ($f in @($msi) + @($exe)) {
            if (-not $f) { throw "missing installer artifact" }
            "{0}  {1:N1} MB" -f $f.Name, ($f.Length / 1MB)
            if ($f.Length -lt 40MB) { throw "$($f.Name) suspiciously small" }
          }

      - name: Validate macOS artifacts
        if: runner.os == 'macOS'
        run: |
          set -e
          DMG=$(ls apps/desktop/src-tauri/target/*/release/bundle/dmg/*.dmg)
          echo "$DMG  $(du -h "$DMG" | cut -f1)"
          test "$(stat -f%z "$DMG")" -gt 40000000
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/madscope-dmg "$DMG"
          ls /tmp/madscope-dmg
          hdiutil detach /tmp/madscope-dmg

      - name: Validate Linux artifacts
        if: runner.os == 'Linux'
        run: |
          set -e
          APP=$(ls apps/desktop/src-tauri/target/*/release/bundle/appimage/*.AppImage)
          DEB=$(ls apps/desktop/src-tauri/target/*/release/bundle/deb/*.deb)
          ls -la "$APP" "$DEB"
          test "$(stat -c%s "$APP")" -gt 40000000
          test "$(stat -c%s "$DEB")" -gt 40000000
          dpkg-deb --info "$DEB"
          ROOT="$PWD"
          tmp=$(mktemp -d) && (cd "$tmp" && "$ROOT/$APP" --appimage-extract >/dev/null) && ls "$tmp/squashfs-root/usr/bin"

      - name: Upload raw bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/*/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/*/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/*/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/*/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/*/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: raw

      - name: Rename to canonical asset names
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p assets
          # Uploaded bundles keep their target/.../bundle/... subdirectories,
          # so locate each artifact with find instead of fixed paths.
          pick() { find raw -name "$1" | head -1; }
          msi=$(pick '*.msi'); test -n "$msi"; cp "$msi" "assets/MadScope-${VER}-windows-x64.msi"
          exe=$(pick '*-setup.exe'); test -n "$exe"; cp "$exe" "assets/MadScope-${VER}-windows-x64-setup.exe"
          dmg_arm=$(pick '*aarch64.dmg'); test -n "$dmg_arm"; cp "$dmg_arm" "assets/MadScope-${VER}-macos-arm64.dmg"
          dmg_x64=$(pick '*x64.dmg'); test -n "$dmg_x64"; cp "$dmg_x64" "assets/MadScope-${VER}-macos-x64.dmg"
          appimage=$(pick '*.AppImage'); test -n "$appimage"; cp "$appimage" "assets/MadScope-${VER}-linux-x64.AppImage"
          deb=$(pick '*.deb'); test -n "$deb"; cp "$deb" "assets/MadScope-${VER}-linux-x64.deb"
          ls -la assets
          test "$(ls assets | wc -l)" -eq 6
          (cd assets && sha256sum * > CHECKSUMS.txt && cat CHECKSUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MadScope ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: assets/*
