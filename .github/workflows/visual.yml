name: Visual regression (MadScope consumer example)
# This workflow shows how a project USING MadScope runs visual tests.
# It is a consumer template, not the MadScope marketplace action itself.
on:
  pull_request:

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      # Screenshot run (exit 0): renders the URL at all configured viewports
      # and uploads the images. For pass/fail regression, commit a
      # .madscope/baselines manifest and run
      # `node apps/cli/dist/index.js test <url>` instead (exit 1 on diffs).
      - run: node apps/cli/dist/index.js screenshot https://example.com --viewport mobile tablet desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madscope-screenshots
          path: .madscope/screenshots/
