name: Visual regression (MadScope consumer example)
# This workflow shows how a project USING MadScope runs visual tests.
# It is a consumer template, not the MadScope marketplace action itself.
on:
  pull_request:

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: node apps/cli/dist/index.js test https://example.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madscope-results
          path: .madscope/results/
