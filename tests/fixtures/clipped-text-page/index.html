<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clipped text</title>
    <style>
      .box {
        width: 180px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border: 1px solid #999;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Clipped text</h1>
      <p class="box">
        Lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod
        tempor.
      </p>
    </main>
  </body>
</html>
